name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gfortran libopenblas-dev liblapack-dev
        python -m pip install --upgrade pip
        pip install numpy scipy cython setuptools wheel
        pip install --upgrade pip setuptools wheel
        pip install meson meson-python numpy cython

    - name: Install scikit-learn
      run: |
        cd scikit-learn
        pip install -e .

    - name: Build scikit-learn from source
      run: |
        git clone https://github.com/scikit-learn/scikit-learn.git
        cd scikit-learn
        pip install --verbose --no-build-isolation --editable .

    - name: Install test dependencies
      run: |
        pip install pytest

    - name: Run tests and save results
      run: |
        cd scikit-learn
        pytest sklearn/tests --tb=short --verbose > ../test_results.txt 2>&1 || true

    - name: Display test results
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        cat test_results.txt >> $GITHUB_STEP_SUMMARY

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results
        path: test_results.txt
        retention-days: 7
