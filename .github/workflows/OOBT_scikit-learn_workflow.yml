name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Ubuntu 24.04
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      OS: ubuntu-24.04
      ARCH: x86_64
      OPENBLAS_VERSION: libopenblas-dev
      LAPACK_VERSION: liblapack-dev

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display environment information
      run: |
        echo "# Environment Information" > environment.md
        echo "" >> environment.md
        echo "- OS: Ubuntu 24.04" >> environment.md
        echo "- Architecture: $(uname -m)" >> environment.md
        echo "- Python version: $(python --version)" >> environment.md
        echo "- GCC version: $(gcc --version | head -n 1)" >> environment.md
        echo "- GFortran version: $(gfortran --version | head -n 1)" >> environment.md

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gfortran \
          libopenblas-dev \
          liblapack-dev

    - name: Install build dependencies 
      run: | 
        python -m pip install --upgrade pip 
        pip install numpy scipy cython meson-python meson ninja setuptools wheel pytest pytest-cov

    - name: Build scikit-learn from source
      run: |
        git clone --depth 1 https://github.com/scikit-learn/scikit-learn.git
        cd scikit-learn

        pip install \
          --verbose \
          --no-build-isolation \
          --editable .

    - name: Run tests and save report in Markdown
      run: |
        mkdir -p reports
        # Uruchamiamy pytest z zapisem szczegółowego outputu do pliku md
        pytest tests/ \
          --cov=sklearn \
          --cov-report=html \
          --tb=short \
          --disable-warnings \
          -q \
          --maxfail=0 \
          > reports/test_report.md 2>&1
        # Dodajemy nagłówek z listą wykonanych testów
        echo "# Test Results" | cat - reports/test_report.md > reports/test_report_final.md
        # Wyciągamy listę testów, które się wykonały
        echo "" >> reports/test_report_final.md
        echo "## Executed tests:" >> reports/test_report_final.md
        pytest --collect-only -q tests/ | grep -v "::" >> reports/test_report_final.md

    - name: Display test results in summary
      if: always()
      run: |
        if [ -f reports/test_report_final.md ]; then
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          tail -n 40 reports/test_report_final.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "No test report found" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: reports/test_report_final.md
        retention-days: 7

    - name: Generate markdown summary
      if: always()
      run: |
        {
          echo "# CI Test Summary"
          echo ""
          echo "## Environment"
          echo ""
          cat environment.md
          echo ""
          echo "## Last 30 lines of test output"
          echo ""
          echo '```'
          
          if [ -f reports/test-report.md ]; then
            tail -n 30 reports/test-report.md
          else
            echo "No test report generated"
          fi
          
          echo '```'
        } >> $GITHUB_STEP_SUMMARY

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report-py${{ matrix.python-version }}
        path: reports/test-report.md
        retention-days: 7

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 7

    - name: Upload environment information
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: environment-py${{ matrix.python-version }}
        path: environment.md
        retention-days: 7
